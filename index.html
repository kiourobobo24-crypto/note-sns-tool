<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>note → SNS 投稿おたすけ v2</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#202630;margin:0;padding:18px}main{max-width:650px;margin:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 5px 24px #0001}h1{font-size:1.5rem}label{display:block;font-weight:bold;margin:18px 0 6px}input,textarea{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #aab2c0;border-radius:9px}textarea{min-height:110px;resize:vertical}button{display:inline-block;border:0;border-radius:9px;background:#1769d2;color:white;padding:11px 16px;font:inherit;cursor:pointer;margin:8px 6px 4px 0}button:disabled{opacity:.5}.secondary{background:#475569}.hint{font-size:.9rem;color:#526072;line-height:1.6}.status{min-height:1.5em;color:#1769d2}footer{margin-top:24px;font-size:.85rem;color:#526072}</style></head><body><main><h1>🍮 note → SNS 投稿おたすけ v2</h1><p>noteの記事をFacebookとXで紹介する文章を作るよ。</p><label for="url">① noteの記事URL</label><input id="url" type="url" placeholder="https://note.com/…" autocomplete="url"><button id="fetch">タイトルを自動取得</button><label for="title">② 記事タイトル</label><input id="title" placeholder="自動取得できないときはここに入力"><p class="hint">URLを貼ったら「タイトルを自動取得」を押してね。取得できない場合も手入力で使えるよ。</p><button id="build">③ 投稿文を作る</button><label for="output">投稿する文章</label><textarea id="output" placeholder="ここにタイトルとURLが表示されます"></textarea><div><button id="copy" class="secondary">文章をコピー</button><button id="x">Xの投稿画面を開く</button><button id="fb" class="secondary">Facebookの共有画面を開く</button></div><p id="status" class="status" aria-live="polite"></p><footer>投稿は自動送信されません。投稿画面で内容を確認して公開してください。Facebookの共有画面はURL共有が中心で、本文の自動入力には対応しない場合があります。タイトル取得では公開記事のURLを外部の取得サービスに送る場合があります。</footer></main><script>
const $=id=>document.getElementById(id);function getData(){const url=$('url').value.trim(),title=$('title').value.trim();try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol)||u.hostname!=='note.com'||!/^\/[^/]+\/n\/n[a-z0-9]+\/?$/i.test(u.pathname))throw Error();return{url:u.href,title,key:u.pathname.split('/').pop()}}catch{return null}}
function build(){const d=getData();if(!d){$('status').textContent='noteの記事URLを確認してね。';return null}if(!d.title){$('status').textContent='記事タイトルを入力してね。';return null}const text=d.title+'\n'+d.url;$('output').value=text;$('status').textContent='投稿文ができたよ！';return {...d,text}}
async function getJson(url){const r=await fetch(url,{signal:AbortSignal.timeout(8000)});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function extractTitle(obj){const x=obj?.data?.name??obj?.data?.title??obj?.name??obj?.title;return typeof x==='string'?x.trim():''}
async function fetchTitle(){const d=getData();if(!d){$('status').textContent='noteの記事URLを確認してね。';return}const btn=$('fetch');btn.disabled=true;$('status').textContent='タイトルを探しているよ…';const api='https://note.com/api/v3/notes/'+encodeURIComponent(d.key);let title='';try{title=extractTitle(await getJson(api))}catch{}if(!title){try{const proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(api);title=extractTitle(await getJson(proxy))}catch{}}if(!title){try{const proxy='https://api.allorigins.win/get?url='+encodeURIComponent(d.url);const j=await getJson(proxy);const html=j.contents||'';const doc=new DOMParser().parseFromString(html,'text/html');title=doc.querySelector('meta[property="og:title"]')?.content||doc.title.replace(/\s*[｜|]\s*note.*$/,'')}catch{}}if($('url').value.trim()===d.url){if(title){$('title').value=title;$('status').textContent='タイトルを取得したよ！✨'}else{$('status').textContent='今回は自動取得できなかったよ。タイトル欄に手入力すれば、今までどおり使えるよ。'}}btn.disabled=false}
$('fetch').onclick=fetchTitle;$('build').onclick=build;$('copy').onclick=async()=>{const s=$('output').value;if(!s){$('status').textContent='先に投稿文を作ってね。';return}try{await navigator.clipboard.writeText(s);$('status').textContent='コピーしたよ！'}catch{$('output').focus();$('output').select();$('status').textContent='文章を選択したよ。コピー操作をしてね。'}};$('x').onclick=()=>{const d=build();if(d)window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(d.text),'_blank','noopener,noreferrer')};$('fb').onclick=()=>{const d=build();if(d)window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(d.url),'_blank','noopener,noreferrer')};
</script></body></html>
